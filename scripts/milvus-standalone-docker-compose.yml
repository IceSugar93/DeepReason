# Milvus Standalone Docker Compose 配置
# 用于本地开发和测试环境
#
# 启动方式:
#   docker compose -f scripts/milvus-standalone-docker-compose.yml up -d
#
# 关闭方式:
#   docker compose -f scripts/milvus-standalone-docker-compose.yml down
#
# Milvus 端口:
#   - 19530: Milvus gRPC 端口（Python SDK 连接用）
#   - 9091: 健康检查 + Metrics 端口
#
# 数据持久化在 Docker Volume 中，重启不会丢失数据。
# 如需彻底清理数据:
#   docker compose -f scripts/milvus-standalone-docker-compose.yml down -v

version: '3.8'

services:
  etcd:
    container_name: deepreason-etcd
    image: quay.io/coreos/etcd:v3.5.16
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - deepreason_net

  minio:
    container_name: deepreason-minio
    image: minio/minio:RELEASE.2024-07-16T17-48-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - deepreason_net

  standalone:
    container_name: deepreason-milvus
    image: milvusdb/milvus:v2.5.4
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    ports:
      - "19530:19530"   # gRPC 端口 — Python SDK 连接
      - "9091:9091"      # 健康检查端口
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - deepreason_net

volumes:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  deepreason_net:
    driver: bridge
